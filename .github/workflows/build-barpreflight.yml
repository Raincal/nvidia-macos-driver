name: Build NVRM (bar-preflight, Intel)

# 在 GitHub 的 Intel runner 上，用 ci/ 里的构建链把当前分支的源码编成 kext。
# 分支 bar-preflight = 上游 tag + 构建链 + 社区 BAR preflight 移植，
# 上游升级做法见 ci/UPSTREAM.md。

on:
  workflow_dispatch:
  push:
    branches: [bar-preflight]
    paths-ignore: ['ci/UPSTREAM.md', '**.md']

permissions:
  contents: read

concurrency:
  group: bar-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Toolchain
        run: |
          test "$(uname -m)" = x86_64
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          command -v gmake || brew install make
          echo "upstream tag: $(cat ci/upstream-tag 2>/dev/null || echo unknown)"

      - name: Fetch pinned NVIDIA source and apply patches
        run: |
          mkdir -p .deps build-out/logs
          git clone --depth 1 --branch 615.78.08 https://github.com/NVIDIA/open-gpu-kernel-modules.git .deps/open-gpu-kernel-modules
          test "$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)" = 1a82fbfda8f321b056eb3568850f9316c5e465c5
          cd .deps/open-gpu-kernel-modules
          git apply ../../ci/patches/610-macos-version-headers.patch
          git apply ../../ci/patches/615-display-completion.patch
          git apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-setmode-reason.patch
          git apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-backlight-register-log.patch
          git apply --recount --directory=src/nvidia-modeset ../../kexts/NVRM/patches/615-viewport-scaling.patch

      - name: Show the ported BAR preflight code
        run: |
          grep -n "nvrm_bar_limits.h\|nvrmBarAddressMax(physBits\|advertisedWindow\|StagedApertures" kexts/NVRM/NVRM.cpp | head

      - name: Build kexts
        run: python3 ci/build-macos-kexts.py --vendor .deps/open-gpu-kernel-modules --output build-out --jobs 4

      - name: Package — replace only NVRM in the official package
        run: python3 ci/package-experiment.py --output build-out

      - name: Summarise
        if: always()
        run: |
          ls -la build-out/*.tar.gz build-out/SHA256SUMS.txt 2>/dev/null || true
          cat build-out/SHA256SUMS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nullmoth-2.6.3-barpreflight-${{ github.run_number }}
          path: |
            build-out/nullmoth-*.tar.gz
            build-out/SHA256SUMS.txt
            build-out/build-proof.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kexts-and-logs-${{ github.run_number }}
          path: |
            build-out/kexts/
            build-out/logs/
          if-no-files-found: warn
          retention-days: 14
