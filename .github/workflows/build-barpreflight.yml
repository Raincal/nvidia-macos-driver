name: Build NVRM (bar-preflight port)

# 上游发新版后尽快构建：每 10 分钟轮询一次 releases/latest
#   检查 job 跑在 ubuntu-latest（便宜、秒级退出），只有确实有新 tag 才起 macOS runner
#   构建方式：克隆上游 tag → 拷入 ci/ → 应用社区 BAR preflight 补丁 → 测试 → 编译 → 打包
#   成功后把 tag 写回 ci/upstream-tag 并提交，下次轮询据此判断已构建
# 手动：可指定任意 tag；上次构建失败后 3 小时内不自动重试，避免反复烧 macOS 分钟

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 tag（留空 = 最新 release）"
        required: false
      package:
        description: "打包成完整驱动 + 1401 安装器"
        type: boolean
        default: true
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: bar-preflight-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.c.outputs.tag }}
      ver: ${{ steps.c.outputs.ver }}
      build: ${{ steps.c.outputs.build }}
      rev: ${{ steps.c.outputs.rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve upstream release and decide
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime, pathlib

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{k}={v}\n")

          forced = (os.environ.get("FORCED_TAG") or "").strip()
          base = pathlib.Path("ci/upstream-tag").read_text().strip()

          if forced:
              tag = forced
          else:
              rel = json.loads(subprocess.check_output(
                  ["gh", "api", "repos/nullmoth/nvidia-macos-driver/releases/latest"]))
              tag = rel["tag_name"]

          build, reason = False, ""
          if forced:
              build, reason = True, "手动触发"
          elif tag == base:
              reason = f"上游仍是 {tag}，已构建过"
          else:
              # 失败退避：最近 3 小时内有一次失败就等人工，别反复烧 macOS 分钟
              try:
                  runs = json.loads(subprocess.check_output([
                      "gh", "run", "list", "--workflow=build-barpreflight.yml",
                      "--limit", "5", "--status", "completed",
                      "--json", "conclusion,createdAt,displayTitle"]))
              except subprocess.CalledProcessError:
                  runs = []
              now = datetime.datetime.now(datetime.timezone.utc)
              recent_fail = None
              for r in runs:
                  if r.get("conclusion") != "failure":
                      continue
                  started = datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  if now - started < datetime.timedelta(hours=3):
                      recent_fail = r
                      break
              if recent_fail:
                  reason = f"{tag} 的构建最近失败过（{recent_fail['createdAt']}），3 小时内不自动重试；修好后手动触发"
              else:
                  build, reason = True, f"发现新版 {tag}（上次构建 {base}）"

          print(reason)
          out("tag", tag)
          out("ver", tag.lstrip("v"))
          out("build", "true" if build else "false")

          # 构建序号按版本从 1 开始：取该版本已有产物的最大序号 + 1
          import re
          names = subprocess.check_output(
              ["gh", "api", "--paginate", "repos/{owner}/{repo}/actions/artifacts?per_page=100",
               "-q", ".artifacts[].name"], text=True).split()
          pat = re.compile(rf"^nullmoth-{re.escape(tag.lstrip('v'))}-bar-preflight-(\d+)$")
          revs = [int(m.group(1)) for m in map(pat.match, names) if m]
          out("rev", max(revs, default=0) + 1)
          PY

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VER: ${{ needs.check.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain
        run: |
          test "$(uname -m)" = x86_64
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          command -v gmake || brew install make
          # 1401's build.sh expands an empty array under `set -u`; system bash 3.2 rejects that.
          [ -x /usr/local/bin/bash ] || brew install bash
          /usr/local/bin/bash --version | head -1
          echo "building $TAG"

      - name: Fetch upstream tree + apply the port patch
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/nullmoth/nvidia-macos-driver.git src
          cp -R ci src/ci
          echo "$TAG" > src/ci/upstream-tag
          cd src
          git apply -3 ci/patches/community-bar-preflight.patch \
            || { echo "STOP: 移植补丁套不上 $TAG，需要人工 rebase 后更新 ci/patches/community-bar-preflight.patch"; exit 1; }
          grep -n "nvrmBarAddressMax(physBits" kexts/NVRM/NVRM.cpp

      - name: Test address limits and fault-inject the preflight staging
        run: |
          cd src
          python3 ci/test-bar-preflight.py

      - name: Fetch pinned NVIDIA source and apply patches
        run: |
          cd src
          mkdir -p .deps build-out/logs
          git clone --depth 1 --branch 615.78.08 https://github.com/NVIDIA/open-gpu-kernel-modules.git .deps/open-gpu-kernel-modules
          test "$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)" = 1a82fbfda8f321b056eb3568850f9316c5e465c5
          cd .deps/open-gpu-kernel-modules
          git apply ../../ci/patches/610-macos-version-headers.patch
          git apply ../../ci/patches/615-display-completion.patch
          git apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-setmode-reason.patch
          git apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-backlight-register-log.patch
          git apply --recount --directory=src/nvidia-modeset ../../kexts/NVRM/patches/615-viewport-scaling.patch

      - name: Restore compiled objects
        uses: actions/cache@v4
        with:
          path: src/build-out/objects
          key: nvobj-${{ hashFiles('ci/build-macos-kexts.py', 'ci/export-nvidia.mk', 'ci/patches/*.patch') }}-615.78.08
          restore-keys: |
            nvobj-

      - name: Build kexts
        run: |
          cd src
          python3 ci/build-macos-kexts.py --vendor .deps/open-gpu-kernel-modules --output build-out --jobs 4

      - name: Restore the stock package
        if: github.event_name == 'schedule' || inputs.package
        uses: actions/cache@v4
        with:
          path: src/build-out/stock-*.tar.gz
          key: stock-${{ needs.check.outputs.tag }}

      - name: Package — replace only NVRM in the official package
        if: github.event_name == 'schedule' || inputs.package
        run: |
          cd src
          VER="${TAG#v}"
          SUM_URL="https://github.com/nullmoth/nvidia-macos-driver/releases/download/$TAG/SHA256SUMS.txt"
          PKG_URL="https://github.com/nullmoth/nvidia-macos-driver/releases/download/$TAG/nullmoth-nvidia-$VER.tar.gz"
          SHA=$(curl -sL "$SUM_URL" | awk -v f="nullmoth-nvidia-$VER.tar.gz" '$2==f || $2=="*"f {print $1; exit}')
          [ -n "$SHA" ] || { echo "STOP: 拿不到 $TAG 的 SHA256"; exit 1; }
          echo "stock: $PKG_URL  sha=$SHA"
          python3 ci/package-experiment.py --output build-out --tag "$TAG" --stock-url "$PKG_URL" --stock-sha "$SHA"

      - name: Restore the 1401 checkout
        if: github.event_name == 'schedule' || inputs.package
        uses: actions/cache@v4
        with:
          path: src/.deps/1401
          key: 1401-${{ needs.check.outputs.tag }}-${{ hashFiles('ci/1401-pins.json') }}

      - name: Build the paired offline 1401 App
        if: github.event_name == 'schedule' || inputs.package
        run: |
          cd src
          # 克隆本身要 78 秒（纯网络），缓存命中时跳过；commit 由下面的脚本校验
          if [ -d .deps/1401/.git ]; then
            echo "using the cached 1401 checkout"
            # 缓存保存的是上一次运行结束时的状态，里面 main.swift 和 build.sh
            # 已被改过；恢复成干净检出，否则下面的字面量断言会失败
            git -C .deps/1401 checkout -- .
          else
            git clone --depth 1 --branch "$TAG" https://github.com/nullmoth/1401 .deps/1401
          fi
          python3 ci/package-test-app.py --tag "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: nullmoth-${{ env.VER }}-bar-preflight-${{ needs.check.outputs.rev }}
          path: |
            src/build-out/nullmoth-*.tar.gz
            src/build-out/1401-*.zip
            src/build-out/SHA256SUMS.txt
            src/build-out/build-proof.json
            src/build-out/installer-proof.json
            src/build-out/kexts/
          if-no-files-found: warn
          retention-days: 30

      # 编译日志只在失败时需要：1100 个单元一台一份，成功时纯噪音
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ env.VER }}-${{ needs.check.outputs.rev }}
          path: src/build-out/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the built tag
        run: |
          BASE=$(cat ci/upstream-tag)
          if [ "$TAG" = "$BASE" ]; then echo "tag 未变化，不提交"; exit 0; fi
          echo "$TAG" > ci/upstream-tag
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/upstream-tag
          git commit -m "ci: built upstream $TAG"
          git push
